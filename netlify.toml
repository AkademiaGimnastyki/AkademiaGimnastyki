[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 4321
  framework = "astro"

# Przekierowanie dla obsługi SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Przekierowanie dla bezpiecznego panelu administracyjnego
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin-auth"
  status = 200

# Przekierowanie dla funkcji autoryzacji OAuth
# Przekierowanie dla funkcji authorize.js, która inicjuje proces autoryzacji GitHub
[[redirects]]
  from = "/api/authorize"
  to = "/.netlify/functions/authorize"
  status = 200

# Przekierowanie dla standardowego przepływu OAuth Netlify
[[redirects]]
  from = "/auth"
  to = "https://api.netlify.com/auth"
  status = 200
  force = true

# Uwaga: Zmienne środowiskowe (GITHUB_CLIENT_ID i GITHUB_CLIENT_SECRET) są ustawione w panelu Netlify
# NIE umieszczaj ich w plikach źródłowych ze względów bezpieczeństwa!
