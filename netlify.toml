[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port = 4321
  framework = "astro"

# Przekierowanie dla obsługi SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Bezpośredni dostęp do panelu /admin
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Przekierowanie dla funkcji authorize (inicjuje flow OAuth)
[[redirects]]
  from = "/authorize"
  to = "/.netlify/functions/authorize"
  status = 200

# Przekierowanie dla funkcji auth (callback OAuth)
[[redirects]]
  from = "/auth"
  to = "/.netlify/functions/auth"
  status = 200

# Przekierowanie dla GitHub OAuth
[[redirects]]
  from = "/callback"
  to = "/admin/#/callback"
  status = 301
  force = true

# Uwaga: Upewnij się, że masz skonfigurowane zmienne środowiskowe w panelu Netlify:
# GITHUB_CLIENT_ID i GITHUB_CLIENT_SECRET
