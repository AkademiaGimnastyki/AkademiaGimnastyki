<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administracyjny Akademii Gimnastyki</title>
  <style>
    body {
      font-family: 'Poppins', 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <!-- Skrypt Decap CMS -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  
  <!-- Konfiguracja bezpośrednia Decap CMS -->
  <script>
    // Podstawowa konfiguracja
    var CMS = window.CMS;
    CMS.registerBackend('github', {
      init: options => ({
        backend: {
          repo: 'AkademiaGimnastyki/AkademiaGimnastyki',
          branch: 'test2',
          auth_type: 'implicit',
          app_id: 'Ov23liV1qsqwtczR888m',
          base_url: 'https://api.github.com'
        }
      }),
    });
    
    // Uruchomienie CMS
    CMS.init();
  </script>
</body>
</html>
